services:
  fire-scenario:
    build: .
    container_name: fire-scenario-app
    restart: unless-stopped
    environment:
      PORT: 3000
      ADMIN_KEY: ${ADMIN_KEY:-museum-admin-change-me}
      TRUST_PROXY: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
